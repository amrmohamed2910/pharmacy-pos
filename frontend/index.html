<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="صيدليتي — نظام إدارة صيدليات متكامل للمبيعات والمخزون والمشتريات والتقارير"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>صيدليتي | نظام إدارة الصيدلية</title>
    <script>
      (function () {
        try {
          const stored = localStorage.getItem("pharmacy-theme");
          const dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          const lang = localStorage.getItem("pharmacy-language") === "en" ? "en" : "ar";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
